# Netlify config for the documentation site (website/).
# Builds the Astro + Starlight docs from the repository root.

[build]
  command = "pnpm docs:build"
  publish = "dist/docs"
  # Skip deploys when nothing the site depends on has changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- website projects/ngx-cookie-service/src package.json pnpm-lock.yaml netlify.toml"

[build.environment]
  NODE_VERSION = "26"
  PNPM_VERSION = "12.21.0"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
